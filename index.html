<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071a28">
<title>Gull Rush</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    position:fixed; inset:0; width:100%; height:100%;
    overflow:hidden;
    background:#071a28;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #wrap {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  canvas {
    display:block;
    touch-action:none;
    cursor:pointer;
    box-shadow:0 0 80px rgba(0,0,0,.55);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
"use strict";

/* ════════════════════════════ TUNABLES ════════════════════════════════ */
const VW = 400, VH = 700;          // virtual resolution (portrait)
const T = {
  gravity:    1480,                // px/s^2
  flap:       -415,                // impulse velocity on tap
  maxFall:     700,                // terminal velocity
  scrollBase:  165,                // world speed at score 0
  scrollRamp:  3.4,                // +px/s per point
  scrollMax:   285,                // speed cap
  spacing:     252,                // horizontal distance between obstacles
  gapBase:     168,                // starting gap height
  gapShrink:   0.5,                // gap shrink per point
  gapMin:      138,                // tightest gap (reached at score 60)
  buoyW:        60,                // obstacle column width
  gullX:       112,                // gull's fixed x
  gullR:        16,                // collision radius
  waterH:       86,                // ocean band height
  oscStart:     12,                // score at which gaps begin to oscillate
  oscAmpPer:   1.6,                // amplitude px per point past oscStart
  oscAmpMax:    42,                // amplitude cap
  oscSpeed:   1.35,                // rad/s of gap oscillation at the start
  oscSpeedMax: 1.9,                // rad/s late game (ramps over scores 40→90)
  fishChance:  0.5,                // golden fish spawn rate
  retryDelay:  0.9,                // seconds before retry tap is accepted
  dprCap:      2.5,
  /* v3 — storms, lightning, gusts */
  stormRamp:   1.5,                // s for rain to fade in/out at band edges
  rainMax:      80,                // pooled rain streak cap (mid-phone safe)
  rainSpdMin:  640,                // streak fall speed range px/s
  rainSpdMax:  860,
  boltGapMin:    2,                // s between lightning strikes (storm only)
  boltGapMax:  4.5,                // ≈2-3 bolts per ~9 s band, not a strobe
  gustStart:    90,                // score at which wind gusts begin
  gustGapMin:    3,                // s between gusts
  gustGapMax:    6,
  gustTele:    0.6,                // telegraph lead time before the force
  gustDur:     1.0,                // gust force duration
  gustAccel:   340,                // peak gust accel px/s² (≈23% of gravity)
  windStreaks:  12,                // pooled gust telegraph streaks
};
/* BEATABILITY CHECK ──────────────────────────────────────────────────────
   At scrollMax (285) and spacing (252) there are 0.884 s between gaps.
   A perfectly-timed flapper climbs flap/2 = 207.5 px/s (each flap arcs
   415→0 vy in 0.28 s covering ~58 px) — a rate that is GRAVITY-
   independent, so an active gust never lowers it — i.e. ~183 px of
   climb between gaps, and falls far faster.  Spawning clamps upward gap
   shifts to 120 px and downward to 190 px, and consecutive obstacles
   SHARE an oscillation phase, so the worst relative drift between
   neighbouring gaps at pass times is
   2·oscAmpMax·sin(oscSpeedMax·0.884/2) ≈ 63 px (random phases could add
   a full ±2·amp = 84 px on top of the clamp).  Worst required shift is
   120 + 63 = 183 px against ~183 px of climb plus ±53 px of in-gap slack
   (gapMin/2 − gullR), so every consecutive pair of gaps stays physically
   threadable even at max difficulty.  Physics integrates trapezoidally,
   so flap arc height is identical at any frame rate.
   GUSTS (score 90+): peak accel A = gustAccel = 340 px/s² ≈ 23% of
   gravity (under the 25% cap), half-sine envelope over D = gustDur =
   1.0 s, telegraphed 0.6 s ahead by streaks + a direction-pitched
   whoosh.  A fully IGNORED gust drifts the gull A·D²/π ≈ 108 px and
   injects 2·A·D/π ≈ 216 px/s — barely half a flap impulse (415 px/s),
   so a single flap-timing adjustment cancels it.  A player reacting
   0.45 s into the force (a full second after the telegraph began) has
   drifted only (A·D/π)·[t − (D/π)·sin(πt/D)] ≈ 15 px and carries
   ~91 px/s to bleed (~15 px more at flap cadence) → ≈ 30 px realistic
   worst case.  At 90+ the gap is pinned at gapMin (since 60) and osc
   speed is capped (at 90), so the worst total is 120 + 63 + 30 = 213 px
   against the 183 + 53 = 236 px budget — closes with ~24 px to spare.
   Storm bands (60s/80s) are visual/audio only; bolts are gated to the
   band itself, and the first gust telegraph can't begin until ≥3 s
   (gustGapMin) after score 90 — past the 1.5 s rain fade-out — so storm
   effects never coincide with a gust.                                  */

const MEDALS = [
  { min: 100, name: "PEARL",  c1: "#ffffff", c2: "#cdd3f7", c3: "#9aa6e8" },
  { min:  50, name: "GOLD",   c1: "#fff3c0", c2: "#ffce4f", c3: "#cf8a1d" },
  { min:  25, name: "SILVER", c1: "#ffffff", c2: "#c4cfd8", c3: "#8d9ca8" },
  { min:  10, name: "BRONZE", c1: "#f3c298", c2: "#cd7f43", c3: "#8a4f22" },
];

/* ═══════════════════════ CANVAS / SCALING ═════════════════════════════ */
const canvas = document.getElementById("game");
const wrap = document.getElementById("wrap");
const ctx = canvas.getContext("2d");
let scale = 1, DPR = 1, pausedDrawn = false;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, T.dprCap);
  // subtract safe-area insets (#wrap padding) so the canvas clears the
  // home indicator / notch in standalone + viewport-fit=cover mode
  const cs = getComputedStyle(wrap);
  const availW = window.innerWidth  -
    ((parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight)  || 0));
  const availH = window.innerHeight -
    ((parseFloat(cs.paddingTop)  || 0) + (parseFloat(cs.paddingBottom) || 0));
  scale = Math.min(availW / VW, availH / VH);
  canvas.style.width  = Math.round(VW * scale) + "px";
  canvas.style.height = Math.round(VH * scale) + "px";
  canvas.width  = Math.round(VW * scale * DPR);
  canvas.height = Math.round(VH * scale * DPR);
  pausedDrawn = false;             // resizing clears the canvas — redraw even if paused
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

/* ═════════════════════════════ HELPERS ════════════════════════════════ */
function rnd(a, b)      { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t)  { return a + (b - a) * t; }
function hx(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function pal3(a, ph) {  // lerp across 3 rgb stops, ph in [0,1]
  const t = clamp(ph, 0, 1) * 2;
  const i = t < 1 ? 0 : 1, f = t - i;
  const c0 = a[i], c1 = a[i + 1];
  return [c0[0]+(c1[0]-c0[0])*f, c0[1]+(c1[1]-c0[1])*f, c0[2]+(c1[2]-c0[2])*f];
}
function rgb(c)     { return "rgb(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + ")"; }
function rgba(c, a) { return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")"; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ════════════ DAY → SUNSET → DUSK PALETTES (lerped by score) ══════════ */
const SKY_TOP = [hx("#7fcdee"), hx("#6b74c0"), hx("#131c40")];
const SKY_MID = [hx("#c6ebf7"), hx("#ef9a6f"), hx("#3c3f74")];
const SKY_HOR = [hx("#fdf2d9"), hx("#ffd9a0"), hx("#7c5380")];
const WAT_TOP = [hx("#39b0c2"), hx("#3a7da3"), hx("#1b3a64")];
const WAT_BOT = [hx("#0e6a86"), hx("#15375c"), hx("#071830")];
const ISL_C   = [hx("#7fae8e"), hx("#5d7a73"), hx("#2c3a52")];
const ISLF_C  = [hx("#aacfdb"), hx("#8d9bc0"), hx("#39466a")];
const SUN_C   = [hx("#fff4c8"), hx("#ffb266"), hx("#ffd296")];
const CLOUD_C = [hx("#eef6fb"), hx("#ffe3d0"), hx("#9d9cc4")];  // day stop off-white so the gull reads in front

/* storm grey-blue targets — blended over the day-dusk result by stormI */
const ST_SKY  = [hx("#46586c"), hx("#5d6b7a"), hx("#75808d")];  // top/mid/hor
const ST_WAT  = [hx("#33505f"), hx("#0c2030")];                 // top/bot
const ST_LAND = hx("#56636f"), ST_CLOUD = hx("#9aa6b2");
function smix(c, s, t) {        // lerp an rgb triplet toward the storm tint
  return [c[0]+(s[0]-c[0])*t, c[1]+(s[1]-c[1])*t, c[2]+(s[2]-c[2])*t];
}
let stormI = 0;                // 0 clear → 1 storming (eased, never snaps)

let phase = 0;                 // 0 day → 0.5 sunset → 1 dusk
let palKey = -1;
const P = {};                  // cached palette: gradients + colors
function refreshPalette() {
  // stormI quantized to 1/16 — at 1/64 the 1.5 s ramp crossed a bucket
  // nearly every frame, defeating the cache exactly when rain is ramping;
  // the storm tint is only 0.55-weighted, so 1/16 steps are invisible
  const k = Math.round(phase * 64) * 200 + Math.round(stormI * 16);
  if (k === palKey) return;
  palKey = k;
  const sm = stormI * 0.55;        // storm blend on TOP of the phase result
  let g = ctx.createLinearGradient(0, 0, 0, VH - T.waterH);
  g.addColorStop(0,    rgb(smix(pal3(SKY_TOP, phase), ST_SKY[0], sm)));
  g.addColorStop(0.55, rgb(smix(pal3(SKY_MID, phase), ST_SKY[1], sm)));
  g.addColorStop(1,    rgb(smix(pal3(SKY_HOR, phase), ST_SKY[2], sm)));
  P.sky = g;
  g = ctx.createLinearGradient(0, VH - T.waterH, 0, VH);
  g.addColorStop(0, rgb(smix(pal3(WAT_TOP, phase), ST_WAT[0], sm)));
  g.addColorStop(1, rgb(smix(pal3(WAT_BOT, phase), ST_WAT[1], sm)));
  P.water = g;
  P.island    = rgb(smix(pal3(ISL_C, phase), ST_LAND, sm));
  P.islandFar = rgb(smix(pal3(ISLF_C, phase), ST_LAND, sm));
  P.sunFill   = rgb(pal3(SUN_C, phase));
  P.sunA      = 1 - stormI * 0.75; // sun hides behind the storm deck
  const cl    = smix(pal3(CLOUD_C, phase), ST_CLOUD, sm);
  P.cloudFar  = rgba(cl, 0.5);     // precomposed — no rgba() churn per frame
  P.cloudNear = rgba(cl, 0.78);
  P.starA     = clamp((phase - 0.62) / 0.38, 0, 1) * (1 - stormI * 0.8);
}

const STARS = [];
for (let i = 0; i < 42; i++) {
  STARS.push({ x: rnd(8, VW - 8), y: rnd(10, VH * 0.5), r: rnd(0.6, 1.6), tw: rnd(0, 6.28) });
}

/* ═════════════════════════ AUDIO (WebAudio synth) ═════════════════════ */
const AudioSys = (() => {
  let ac = null, master = null, noiseBuf = null;
  let bedSrc = null, bedGain = null;   // looping storm rain/wind bed
  let muted = localStorage.getItem("gullRushMuted") === "1";

  function ensure() {
    // iOS Safari (16.4+): route as media playback so the physical
    // ringer/silent switch doesn't mute WebAudio. No-op elsewhere.
    try {
      if (navigator.audioSession && navigator.audioSession.type !== "playback")
        navigator.audioSession.type = "playback";
    } catch (e) {}
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain();
        master.gain.value = muted ? 0 : 1;
        master.connect(ac.destination);
        const len = (ac.sampleRate * 0.5) | 0;
        noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    // !== "running" also covers iOS WebKit's non-standard "interrupted"
    // state (phone call / Siri / backgrounding) which never auto-resumes
    if (ac && ac.state !== "running") ac.resume();
    return ac;
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, f0, f1, delay) {
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const src = ac.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }
  function stormBed(level) {         // low rain/wind noise bed — tracks stormI
    if (!ac) return;                 // so the 70s/90s "eerie calm" is audible,
    if (level > 0.001 && !bedSrc) {  // not just visual (storms start at score
      bedSrc = ac.createBufferSource();      // 60, long after the first tap
      bedSrc.buffer = noiseBuf; bedSrc.loop = true;  // created the context)
      const lp = ac.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 480; lp.Q.value = 0.5;
      bedGain = ac.createGain(); bedGain.gain.value = 0;
      bedSrc.connect(lp); lp.connect(bedGain); bedGain.connect(master);
      bedSrc.start();
    }
    if (bedGain) bedGain.gain.value = level * 0.055;  // eased by stormI itself
    if (bedSrc && level <= 0.001) {  // fully faded — free the source
      bedSrc.stop(); bedSrc.disconnect(); bedGain.disconnect();
      bedSrc = null; bedGain = null;
    }
  }
  return {
    ensure,
    stormBed,
    get muted() { return muted; },
    toggleMute() {
      muted = !muted;
      localStorage.setItem("gullRushMuted", muted ? "1" : "0");
      if (master) master.gain.value = muted ? 0 : 1;
    },
    flap()   { if (!ensure()) return; tone(430, 760, 0.09, "sine", 0.07); noise(0.07, 0.05, 900, 2400); },
    score()  { if (!ensure()) return; tone(660, 660, 0.07, "triangle", 0.09); tone(990, 990, 0.09, "triangle", 0.08, 0.07); },
    fish()   { if (!ensure()) return; tone(784, 784, 0.07, "square", 0.06); tone(1046, 1046, 0.07, "square", 0.06, 0.06); tone(1318, 1568, 0.12, "square", 0.05, 0.12); },
    hit()    { if (!ensure()) return; tone(220, 50, 0.28, "sawtooth", 0.15); noise(0.16, 0.12, 320, 110); },
    splash() { if (!ensure()) return; noise(0.45, 0.18, 1400, 180); tone(240, 70, 0.32, "sine", 0.06); },
    ui()     { if (!ensure()) return; tone(740, 740, 0.05, "square", 0.045); },
    whoosh(dir) {                    // pitch encodes gust direction: falling
      if (!ensure()) return;         // sweep = down-gust, rising = up-gust
      if (dir > 0) noise(0.7, 0.10, 1500, 260);
      else         noise(0.7, 0.10, 260, 1500);
    },
    thunder(delay) {                 // low filtered-noise rumble, after the flash
      if (!ensure()) return;
      noise(1.6, 0.22, 190, 55, delay);
      noise(1.1, 0.13, 95, 45, delay + 0.10);
    },
    milestone(d) {                   // decade chime: rising arpeggio, root climbs
      if (!ensure()) return;        // +3 semitones per decade (10 low … 90 high)
      const r = 392 * Math.pow(2, (Math.min(d, 12) - 1) / 4);
      tone(r,        r,        0.10, "triangle", 0.13);  // louder than the
      tone(r * 1.25, r * 1.25, 0.10, "triangle", 0.13, 0.09); // per-point blip
      tone(r * 1.5,  r * 1.5,  0.18, "triangle", 0.13, 0.18);
    },
    pearl() {                        // score-100 fanfare: long shimmering run
      if (!ensure()) return;
      const seq = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568, 2093];
      for (let i = 0; i < seq.length; i++)
        tone(seq[i], seq[i], 0.30, "triangle", 0.09, i * 0.09);
      tone(1046.5, 1046.5, 0.8, "sine", 0.05, 0.63);
      tone(2093,   2637,   0.9, "sine", 0.04, 0.70);
      noise(1.2, 0.04, 3000, 5600, 0.55);
    },
  };
})();

/* ════════════════════ PRE-RENDERED BUOY SPRITE ════════════════════════
   Buoys use a radial gradient + stripes; rendering ~40 of those per frame
   with live gradients is slow on phones, so we bake one sprite once.    */
const buoySprite = (() => {
  const r = T.buoyW / 2, ss = 3, pad = 4;
  const c = document.createElement("canvas");
  const size = Math.ceil((r + pad) * 2 * ss);
  c.width = size; c.height = size;
  const x = c.getContext("2d");
  x.scale(ss, ss);
  const cx = r + pad, cy = r + pad;
  // red body
  let g = x.createRadialGradient(cx - r * 0.35, cy - r * 0.42, r * 0.15, cx, cy, r * 1.06);
  g.addColorStop(0, "#ff8264");
  g.addColorStop(0.55, "#e0433a");
  g.addColorStop(1, "#971e26");
  x.fillStyle = g;
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  // white stripes (clipped to the sphere)
  x.save();
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.clip();
  x.fillStyle = "#f7f4ec";
  x.fillRect(cx - r, cy - r * 0.40, r * 2, r * 0.30);
  x.fillRect(cx - r, cy + r * 0.18, r * 2, r * 0.26);
  // shading overlay to keep the sphere illusion across stripes
  g = x.createLinearGradient(cx - r, 0, cx + r, 0);
  g.addColorStop(0, "rgba(60,16,18,0.38)");
  g.addColorStop(0.33, "rgba(255,255,255,0)");
  g.addColorStop(1, "rgba(60,16,18,0.45)");
  x.fillStyle = g;
  x.fillRect(cx - r, cy - r, r * 2, r * 2);
  x.restore();
  // glossy highlight
  x.fillStyle = "rgba(255,255,255,0.55)";
  x.beginPath(); x.ellipse(cx - r * 0.34, cy - r * 0.45, r * 0.20, r * 0.12, -0.6, 0, Math.PI * 2); x.fill();
  // mooring ring on top
  x.strokeStyle = "rgba(62,38,34,0.85)"; x.lineWidth = 2.4;
  x.beginPath(); x.arc(cx, cy - r * 0.88, r * 0.13, 0, Math.PI * 2); x.stroke();
  // rim
  x.strokeStyle = "rgba(105,22,26,0.5)"; x.lineWidth = 1.6;
  x.beginPath(); x.arc(cx, cy, r - 0.8, 0, Math.PI * 2); x.stroke();
  return { img: c, half: r + pad, size: (r + pad) * 2 };
})();

/* ═══════════════════════════ GAME STATE ═══════════════════════════════ */
const S = { MENU: 0, PLAY: 1, DEAD: 2 };
let state = S.MENU;
let paused = false;
let best = +(localStorage.getItem("gullRushBest") || 0);
/* cached HUD strings — the menu/death panels redraw every frame (the world
   animates behind them), so never concatenate in drawHUD (see scoreStr) */
let bestLineMenu = "best  " + best, bestLineDead = "", entrySub = "";

let time = 0, lastT = 0, oscPhase = 0;
let gull, obstacles, fishes, floaters;
let score, scoreStr, scorePop, speed, shake, flashT, deathT;
let cloudsFar, cloudsNear, boats, islOff;
let scoreFontSz = 0, scoreFont = "";   // cached HUD font string

/* ─────────────── v3: milestones / storm / gust / board state ────────── */
let lastMilestone = 0, milestoneGlow = 0;   // decade chime + HUD halo pulse

let rainN = 0, rainVX = 0, lightT = 0, boltT = 0, stormWasOn = false;
let gustMode = 0, gustClock = 0, gustDir = 1, gustWait = 0; // 0 idle/1 telegraph/2 force
const RAIN = [];                            // pooled — never allocated per frame
for (let i = 0; i < T.rainMax; i++) RAIN.push({ x: 0, y: 0, spd: 0, j: 1 });
function seedRain(r, anywhere) {
  r.x = rnd(-20, VW + 70);
  r.y = anywhere ? rnd(-40, VH - T.waterH - 10) : rnd(-60, -8);
  r.spd = rnd(T.rainSpdMin, T.rainSpdMax);
  r.j = rnd(0.75, 1.25);
}
const WIND = [];                            // pooled gust telegraph streaks
for (let i = 0; i < T.windStreaks; i++) WIND.push({ x: 0, y: 0, spd: 0, len: 0 });
function seedWind() {
  for (const w of WIND) {
    w.x = rnd(0, VW + 80);
    w.y = rnd(40, VH - T.waterH - 40);
    w.spd = rnd(480, 760);
    w.len = rnd(36, 70);
  }
}

const particles = [], pPool = [];
function emit(x, y, vx, vy, life, r, color, grav, glow) {
  const p = pPool.pop() || {};
  p.x = x; p.y = y; p.vx = vx; p.vy = vy;
  p.life = life; p.max = life; p.r = r; p.c = color;
  p.g = grav; p.glow = !!glow;
  particles.push(p);

function stepParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt;
    if (p.life <= 0) {
      particles[i] = particles[particles.length - 1];
      particles.pop();
      pPool.push(p);
    }
  }

function currentGap()  { return Math.max(T.gapMin, T.gapBase - score * T.gapShrink); }
function currentAmp()  {

function circleVsRect(cx, cy, cr, x0, y0, x1, y1) {

function update(dt) {

    if (c.x < -110) { c.x = VW + 80; c.y = rnd(36, 220); c.s = rnd(0.45, 0.7); }
  }
  for (const c of cloudsNear) {
    c.x -= (c.spd + worldSpd * 0.16) * dt * ambF;
    if (c.x < -130) { c.x = VW + 100; c.y = rnd(60, 300); c.s = rnd(0.9, 1.35); }
  }
  for (const b of boats) {
    b.x -= (b.spd + worldSpd * 0.10) * dt * ambF;
    if (b.x < -90) { b.x = VW + 80; b.s = rnd(0.65, 1.0); b.spd = rnd(8, 14); }

  const stormTgt = ((score >= 60 && score < 70) || (score >= 80 && score < 90)) ? 1 : 0;

  stormWasOn = stormTgt === 1;                             // with an early bolt
  const dS = dt / T.stormRamp;
  stormI += clamp(stormTgt - stormI, -dS, dS);
  AudioSys.stormBed(stormI);                   // rain/wind bed fades with band

  /* pooled rain — active count tracks intensity; objects never reallocated */
  const targetRain = Math.round(stormI * T.rainMax);
  while (rainN < targetRain) { seedRain(RAIN[rainN], true); rainN++; }
  if (rainN > 0) {
    rainVX = -(worldSpd * 0.55 + 28);          // streak angle follows scroll
    const wy = VH - T.waterH;
    for (let i = 0; i < rainN; i++) {
      const r = RAIN[i];
      r.x += rainVX * r.j * dt; r.y += r.spd * dt;
      if (r.y > wy) {                          // tiny splash at the water line
        emit(r.x, wy + 2, rnd(-26, 26), rnd(-120, -40), 0.22, 1.4, "#cfe4f2", 620);
        if (rainN > targetRain) {              // fade-out: excess streaks DRAIN
          rainN--;                             // at the waterline instead of
          RAIN[i] = RAIN[rainN];               // vanishing mid-air (swap-remove
          RAIN[rainN] = r;                     // keeps the active range
          i--;                                 // contiguous; the swapped-in
        }                                      // streak still gets its step)
        else seedRain(r, false);

  boltT = Math.max(0, boltT - dt);
  if (stormTgt === 1 && stormI > 0.6 && state === S.PLAY) {
    lightT -= dt;
    if (lightT <= 0) {
      lightT = rnd(T.boltGapMin, T.boltGapMax);
      boltT = 0.3;
      AudioSys.thunder(rnd(0.3, 0.8));
    }
  }

  stepParticles(dt);
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 48 * dt; f.life -= dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  scorePop = Math.max(0, scorePop - dt * 3.2);
  milestoneGlow = Math.max(0, milestoneGlow - dt * 1.4);
  shake = Math.max(0, shake - dt * 55);
  flashT = Math.max(0, flashT - dt);
  if (gull) gull.flapT = Math.max(0, gull.flapT - dt * 4.5);

  // sky drifts day → sunset → dusk with score
  const phTarget = clamp(score / 50, 0, 1);
  phase += (phTarget - phase) * Math.min(1, dt * 0.6);
  refreshPalette();

  oscPhase += currentOscSpeed() * dt;

  if (state === S.MENU) {
    gull.y = VH * 0.66 + Math.sin(time * 2.4) * 8;  // idle hover, below the title panel
  }

  if (state === S.PLAY) {
    // ease toward the target so a fish (+3) nudges rather than lurches
    const targetSpd = Math.min(T.scrollBase + score * T.scrollRamp, T.scrollMax);
    speed += (targetSpd - speed) * Math.min(1, dt * 2);

    /* wind gusts (90+): 0.6 s telegraph (streaks + whoosh), then a 1 s

        }
      } else {

        if (gustMode === 1 && gustClock <= 0) { gustMode = 2; gustClock = T.gustDur; }
        else if (gustMode === 2 && gustClock <= 0) {

        }
      }
      if (gustMode) {                // pooled streaks sweep in gust direction
        for (const w of WIND) {

          if (w.x < -w.len) { w.x = VW + rnd(10, 90); w.y = rnd(40, VH - T.waterH - 40); }
          if (w.y < 24) w.y = VH - T.waterH - 44;
          else if (w.y > VH - T.waterH - 14) w.y = 34;
        }
      }
    }

    // identical at 20 fps and 120 fps (semi-implicit Euler loses ~15%

    gull.y += (vy0 + gull.vy) * 0.5 * dt;

    if (gull.y < T.gullR) { gull.y = T.gullR; gull.vy = 0; }

        score++;

                                                 // blip would smear it by a
                                                 // semitone at decades 5/6
      }

        const gy = gapYOf(ob);       // collide against CURRENT gap position
        const br = T.buoyW / 2;

        const x0 = ob.x - br, x1 = ob.x + br;
        // the end buoys nearest the gap are drawn round — collide them as
        // circles so the bare rect corners can't kill a gull that visibly
        // cleared the curved silhouette (~12 px phantom zone otherwise)
        if (circleVsCircle(gull.x, gull.y, T.gullR, ob.x, gapTop - br, br) ||
            circleVsCircle(gull.x, gull.y, T.gullR, ob.x, gapBot + br, br) ||
            circleVsRect(gull.x, gull.y, T.gullR, x0, -60, x1, gapTop - br) ||
            circleVsRect(gull.x, gull.y, T.gullR, x0, gapBot + br, x1, VH - T.waterH + 30)) {
          die(false);
        }
      }
    }
    if (obstacles.length && obstacles[0].x < -T.buoyW - buoySprite.half) obstacles.shift();
    while (obstacles.length &&
           obstacles[obstacles.length - 1].x < VW + T.spacing * 1.5) {
      spawnObstacle(obstacles[obstacles.length - 1].x + T.spacing);
    }

    // golden fish
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      f.x -= speed * dt;
      f.wig += dt * 9;
      if (f.x < -40) { fishes.splice(i, 1); continue; }
      const fy = f.baseY + Math.sin(f.wig) * 11;
      const dx = f.x - gull.x, dy = fy - gull.y;
      const rr = T.gullR + 14;
      if (dx * dx + dy * dy < rr * rr) {
        fishes.splice(i, 1);
        score += 3;
        scoreStr = "" + score;
        scorePop = 1;
        if (!checkMilestone()) AudioSys.fish();  // same gate as the blip
        floaters.push({ x: f.x, y: fy - 12, txt: "+3", life: 0.9 });
        for (let j = 0; j < 14; j++) {
          emit(f.x, fy, rnd(-150, 150), rnd(-160, 120),
               rnd(0.3, 0.65), rnd(1.5, 3.5), "#ffd86b", 180, true);
        }
      }
    }
  }

  if (state === S.DEAD) {
    deathT += dt;
    const floorY = VH - T.waterH - 4;
    if (!gull.splashed) {
      // tumble out of the sky
      gull.vy = clamp(gull.vy + T.gravity * dt, -900, T.maxFall);
      gull.y += gull.vy * dt;
      gull.rot += gull.spin * dt;
      if (gull.y >= floorY) {
        gull.y = floorY;
        gull.splashed = true;
        makeSplash(gull.x, 20);
      }
    } else {
      // bob belly-up in the swell
      gull.y = floorY + 6 + Math.sin(time * 2.6) * 2;
      const settle = Math.PI * (gull.spin < 0 ? -1 : 1);
      gull.rot += (settle - gull.rot) * Math.min(1, dt * 3);
    }
  }
}

/* ════════════════════════════ RENDER: WORLD ═══════════════════════════ */
function drawSky() {
  ctx.fillStyle = P.sky;
  ctx.fillRect(0, 0, VW, VH - T.waterH);

  // stars fade in at dusk
  if (P.starA > 0.01) {
    ctx.fillStyle = "#fff";
    for (const s of STARS) {
      ctx.globalAlpha = P.starA * (0.4 + 0.6 * Math.abs(Math.sin(time * 1.2 + s.tw)));
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }

  // sun sinks toward the horizon as dusk approaches
  const e = phase * phase;
  const sx = VW - 78 - phase * 70;
  const sy = lerp(96, VH - T.waterH - 36, e);
  ctx.globalAlpha = 0.30 * (1 - phase * 0.5) * P.sunA;
  ctx.fillStyle = P.sunFill;
  ctx.beginPath(); ctx.arc(sx, sy, 72, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = (0.85 - phase * 0.35) * P.sunA;
  ctx.beginPath(); ctx.arc(sx, sy, 42, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // lightning: dim blue-white wash from the top of the sky — a quick
  // DOUBLE flicker, deliberately nothing like the full-white death flash
  if (boltT > 0) {
    const t = 0.3 - boltT;
    const s1 = Math.max(0, 1 - Math.abs(t - 0.04) / 0.05);
    const s2 = Math.max(0, 1 - Math.abs(t - 0.17) / 0.08);
    const a = Math.max(s1 * 0.8, s2) * 0.45;
    if (a > 0.01) {
      ctx.globalAlpha = a;
      ctx.fillStyle = BOLT_GRAD;
      ctx.fillRect(0, 0, VW, (VH - T.waterH) * 0.7);
      ctx.globalAlpha = 1;
    }
  }
}

function puff(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }
function drawCloudLayer(layer, fill) {
  ctx.fillStyle = fill;
  for (const c of layer) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.beginPath();
    puff(0, 0, 26); puff(26, 6, 19); puff(-24, 7, 17); puff(7, -11, 18);
    ctx.fill();
    ctx.restore();
  }
}

const ISLANDS = [
  { x: 110, w: 170, h: 26, light: false },
  { x: 430, w: 120, h: 18, light: true  },
  { x: 660, w: 190, h: 30, light: false },
];
function drawIslands() {
  const hy = VH - T.waterH;
  const loop = VW * 2;
  for (const isl of ISLANDS) {
    let x = isl.x - islOff;
    if (x < -loop / 2) x += loop;
    if (x > loop) x -= loop;
    if (x < -isl.w || x > VW + isl.w) continue;

    // far haze hump behind
    ctx.fillStyle = P.islandFar;
    ctx.beginPath();
    ctx.ellipse(x + isl.w * 0.3, hy + 4, isl.w * 0.75, isl.h * 1.25, 0, Math.PI, 0);
    ctx.fill();
    // main island
    ctx.fillStyle = P.island;
    ctx.beginPath();
    ctx.ellipse(x, hy + 3, isl.w * 0.55, isl.h, 0, Math.PI, 0);
    ctx.fill();

    if (isl.light) {
      // lighthouse
      const lx = x, base = hy - isl.h * 0.55, hh = 44;
      ctx.fillStyle = "#e8e4da";
      ctx.beginPath();
      ctx.moveTo(lx - 6, base); ctx.lineTo(lx + 6, base);
      ctx.lineTo(lx + 4, base - hh); ctx.lineTo(lx - 4, base - hh);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c84a48";
      ctx.fillRect(lx - 5.4, base - hh * 0.42, 10.8, 7);
      ctx.fillRect(lx - 4.7, base - hh * 0.78, 9.4, 6);
      // lamp house + cap
      ctx.fillStyle = "#3a3f48";
      ctx.fillRect(lx - 4.5, base - hh - 7, 9, 7);
      ctx.beginPath();
      ctx.moveTo(lx - 6, base - hh - 7); ctx.lineTo(lx + 6, base - hh - 7);
      ctx.lineTo(lx, base - hh - 13); ctx.closePath(); ctx.fill();
      // blinking lamp
      const lampA = Math.pow(Math.max(0, Math.sin(time * 1.8)), 10);
      if (lampA > 0.02) {
        const ly = base - hh - 3.5;
        ctx.globalAlpha = lampA;
        ctx.fillStyle = "#fff2a8";
        ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = lampA * 0.35;
        ctx.beginPath(); ctx.arc(lx, ly, 10, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
}

function drawBoats() {
  const hy = VH - T.waterH;
  for (const b of boats) {
    ctx.save();
    ctx.translate(b.x, hy + 1 + Math.sin(time * 1.6 + b.ph) * 2);
    ctx.rotate(Math.sin(time * 1.3 + b.ph) * 0.05);
    ctx.scale(b.s, b.s);
    ctx.fillStyle = "#7a4f34";
    ctx.beginPath();
    ctx.moveTo(-22, 0); ctx.lineTo(22, 0); ctx.lineTo(14, 11); ctx.lineTo(-14, 11);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#4e3322"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(0, 0); ctx.stroke();
    ctx.fillStyle = "#f4f1e8";
    ctx.beginPath();
    ctx.moveTo(1.5, -26); ctx.lineTo(1.5, -3); ctx.lineTo(17, -3);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d8606a";
    ctx.beginPath();
    ctx.moveTo(-1.5, -24); ctx.lineTo(-1.5, -5); ctx.lineTo(-15, -5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawWaterBack() {
  const wy = VH - T.waterH;
  ctx.fillStyle = P.water;
  ctx.fillRect(0, wy - 2, VW, T.waterH + 2);

  // gull's shadow on the swell
  if (gull) {
    const hFrac = clamp(1 - (wy - gull.y) / (VH - T.waterH), 0.1, 1);
    ctx.globalAlpha = 0.16 * hFrac;
    ctx.fillStyle = "#062a38";
    ctx.beginPath();
    ctx.ellipse(gull.x, wy + 9, 16 * hFrac + 8, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawWaterFront() {
  const wy = VH - T.waterH;

  // translucent crest band so the gull visually sinks into the surf
  ctx.fillStyle = P.water;
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(0, wy + 22);
  for (let x = 0; x <= VW; x += 10) {
    ctx.lineTo(x, wy + Math.sin(x * 0.05 + time * 2.6) * 4 + Math.sin(x * 0.11 - time * 1.7) * 2);
  }
  ctx.lineTo(VW, wy + 22);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // foam crest
  ctx.strokeStyle = "rgba(255,255,255,0.65)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = 0; x <= VW; x += 8) {
    const y = wy + Math.sin(x * 0.05 + time * 2.6) * 4 + Math.sin(x * 0.11 - time * 1.7) * 2;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  // second softer wave line
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= VW; x += 10) {
    const y = wy + 16 + Math.sin(x * 0.045 - time * 2.0) * 3.5;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  // shimmer dashes
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  for (let i = 0; i < 7; i++) {
    const x = ((i * 73 + time * 34) % (VW + 60)) - 30;
    ctx.fillRect(x, wy + 26 + (i % 3) * 17, 24, 3);
  }
}

function drawObstacles() {
  const r = T.buoyW / 2;
  const step = r * 1.6;
  ctx.strokeStyle = "rgba(36,52,62,0.5)";
  ctx.lineWidth = 3;
  for (const ob of obstacles) {
    if (ob.x - buoySprite.half > VW) continue;   // spawned ahead, not on screen yet
    const gy = gapYOf(ob);
    const gapTop = gy - ob.gap / 2;
    const gapBot = gy + ob.gap / 2;
    // mooring ropes
    ctx.beginPath();
    ctx.moveTo(ob.x, -10); ctx.lineTo(ob.x, gapTop - 4);
    ctx.moveTo(ob.x, gapBot + 4); ctx.lineTo(ob.x, VH - T.waterH + 16);
    ctx.stroke();
    // top chain (hangs down to the gap) — the end buoy (i=0) doesn't bob
    // so the drawn silhouette matches the hitbox at the gap edge
    let y = gapTop - r, i = 0;
    while (y > -r && i < 24) {
      const bob = i === 0 ? 0 : Math.sin(time * 2 + ob.x * 0.05 + i * 1.1) * 2;
      ctx.drawImage(buoySprite.img, ob.x - buoySprite.half, y + bob - buoySprite.half,
                    buoySprite.size, buoySprite.size);
      y -= step; i++;
    }
    // bottom chain (rises from the sea to the gap)
    y = gapBot + r; i = 0;
    while (y < VH - T.waterH + r && i < 24) {
      const bob = i === 0 ? 0 : Math.sin(time * 2 + ob.x * 0.05 + i * 1.3 + 2) * 2;
      ctx.drawImage(buoySprite.img, ob.x - buoySprite.half, y + bob - buoySprite.half,
                    buoySprite.size, buoySprite.size);
      y += step; i++;
    }
  }
}

function drawFishes() {
  for (const f of fishes) {
    if (f.x - 22 > VW) continue;     // spawned ahead, not on screen yet
    const fy = f.baseY + Math.sin(f.wig) * 11;
    ctx.save();
    ctx.translate(f.x, fy);
    // glow halo
    ctx.fillStyle = "rgba(255,210,74,0.22)";
    ctx.beginPath(); ctx.arc(0, 0, 18 + Math.sin(time * 5) * 2, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(Math.sin(f.wig * 1.4) * 0.2);
    // body
    ctx.fillStyle = "#ffd24a";
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 8, 0, 0, Math.PI * 2); ctx.fill();
    // tail
    ctx.fillStyle = "#f0a338";
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(20, -7); ctx.lineTo(20, 7);
    ctx.closePath(); ctx.fill();
    // fin
    ctx.beginPath();
    ctx.moveTo(-2, -6); ctx.lineTo(3, -12); ctx.lineTo(6, -5);
    ctx.closePath(); ctx.fill();
    // belly shine + eye
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath(); ctx.ellipse(-3, 3, 7, 3, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#20303a";
    ctx.beginPath(); ctx.arc(-7, -2, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawGull() {
  if (!gull) return;
  ctx.save();
  ctx.translate(gull.x, gull.y);
  ctx.rotate(state === S.MENU ? Math.sin(time * 2.2) * 0.08 : gull.rot);

  // wing lift: 0 = folded down, 1 = raised mid-flap
  let lift;
  if (state === S.MENU) lift = (Math.sin(time * 7) + 1) * 0.5;
  else lift = Math.sin(Math.min(gull.flapT, 1) * Math.PI);
  const wingAng = lerp(0.55, -1.15, lift);

  function wing(dir, fill, tip) {
    ctx.save();
    ctx.translate(-3, -3);
    ctx.rotate(wingAng * dir);
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(2, 0);
    ctx.quadraticCurveTo(-10, 2, -22, 12);
    ctx.quadraticCurveTo(-24, 14, -20, 14);
    ctx.quadraticCurveTo(-6, 12, 4, 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = tip;  // dark wingtip
    ctx.beginPath();
    ctx.moveTo(-15, 9);
    ctx.quadraticCurveTo(-22, 12, -22.5, 13.5);
    ctx.quadraticCurveTo(-18, 14.5, -13, 12.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // far wing (behind body, slightly offset)
  wing(0.7, "#b9c6cf", "#48555e");

  // tail
  ctx.fillStyle = "#e3e9ed";
  ctx.beginPath();
  ctx.moveTo(-13, -1); ctx.lineTo(-26, -6); ctx.lineTo(-23, 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#3a4750";
  ctx.beginPath();
  ctx.moveTo(-21, -4); ctx.lineTo(-26, -6); ctx.lineTo(-24, 0);
  ctx.closePath(); ctx.fill();

  // body
  ctx.fillStyle = "#f6f8fa";
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 12, 0, 0, Math.PI * 2); ctx.fill();
  // grey mantle
  ctx.fillStyle = "#c9d3da";
  ctx.beginPath(); ctx.ellipse(-3, -3, 14, 8, -0.1, Math.PI, Math.PI * 2); ctx.fill();
  // thin contour so the white body reads against bright day sky + clouds
  ctx.strokeStyle = "rgba(45,62,72,0.5)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 12, 0, 0, Math.PI * 2); ctx.stroke();

  // head
  ctx.fillStyle = "#f6f8fa";
  ctx.beginPath(); ctx.arc(13, -6, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(45,62,72,0.5)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(13, -6, 9, -2.6, 1.2); ctx.stroke();  // partial arc — skips the neck join

  // beak — opens slightly mid-flap
  const open = lift * 1.6;
  ctx.fillStyle = "#ff9b21";
  ctx.beginPath();
  ctx.moveTo(20, -7.5); ctx.lineTo(31, -4.5 - open); ctx.lineTo(20, -4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#e8830f";
  ctx.beginPath();
  ctx.moveTo(20, -3.5); ctx.lineTo(30, -2.5 + open); ctx.lineTo(20, -1);
  ctx.closePath(); ctx.fill();

  // eye
  if (gull.alive) {
    ctx.fillStyle = "#1a2a33";
    ctx.beginPath(); ctx.arc(16, -7.5, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(16.8, -8.3, 0.8, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.strokeStyle = "#1a2a33"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(13.6, -9.9); ctx.lineTo(18.4, -5.1);
    ctx.moveTo(18.4, -9.9); ctx.lineTo(13.6, -5.1);
    ctx.stroke();
  }

  // near wing (in front)
  wing(1, "#e4ebef", "#5a6770");

  ctx.restore();
}

function drawParticles() {
  let hasGlow = false;
  for (const p of particles) {
    if (p.glow) { hasGlow = true; continue; }
    ctx.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  if (hasGlow) {
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      if (!p.glow) continue;
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.globalAlpha = 1;
}

let rainAQ = -1, rainStroke = "";    // stroke alpha follows stormI so streaks
function drawRain() {                // seeded mid-air on fade-in are invisible;
  if (!rainN) return;                // quantized to 1/16 — ~17 strings per
  const q = Math.round(clamp(stormI, 0, 1) * 16);     // transition, not per
  if (q === 0) return;                                // frame
  if (q !== rainAQ) { rainAQ = q; rainStroke = "rgba(205,228,242," + q * 0.025 + ")"; }
  ctx.strokeStyle = rainStroke;      // one path + one stroke for all streaks
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i < rainN; i++) {
    const r = RAIN[i];
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x - rainVX * r.j * 0.045, r.y - r.spd * 0.045);
  }
  ctx.stroke();
}

function drawWind() {
  if (!gustMode) return;
  const a = gustMode === 1           // ramp in over the telegraph, fade out
    ? Math.min(1, (T.gustTele - gustClock) / 0.18)
    : Math.min(1, gustClock / 0.3);
  if (a <= 0.01) return;
  ctx.globalAlpha = a * 0.6;
  ctx.strokeStyle = "#f0f7ff";       // pale — reads on the dark dusk sky
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const w of WIND) {
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(w.x + w.len, w.y - gustDir * w.len * 0.25);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  if (!floaters.length) return;      // skip the (pricey) ctx.font set when idle
  ctx.textAlign = "center";
  ctx.font = "800 24px -apple-system, system-ui, sans-serif";
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life * 1.5, 0, 1);
    ctx.strokeStyle = "rgba(90,50,0,0.8)"; ctx.lineWidth = 4;
    ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = "#ffd24a";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ════════════════════════ RENDER: HUD / SCREENS ═══════════════════════ */
function drawMuteBtn() {
  const b = MUTE_BTN;
  ctx.fillStyle = "rgba(10,32,44,0.45)";
  roundRect(b.x, b.y, b.w, b.h, 10);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.5;
  roundRect(b.x, b.y, b.w, b.h, 10);
  ctx.stroke();
  const cx = b.x + b.w / 2 - 3, cy = b.y + b.h / 2;
  // speaker
  ctx.fillStyle = "#eaf4f8";
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy - 4); ctx.lineTo(cx - 3, cy - 4);
  ctx.lineTo(cx + 3, cy - 9); ctx.lineTo(cx + 3, cy + 9);
  ctx.lineTo(cx - 3, cy + 4); ctx.lineTo(cx - 8, cy + 4);
  ctx.closePath(); ctx.fill();
  if (AudioSys.muted) {
    ctx.strokeStyle = "#ff6b5e"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x + 8, b.y + b.h - 8); ctx.lineTo(b.x + b.w - 8, b.y + 8);
    ctx.stroke();
  } else {
    ctx.strokeStyle = "#eaf4f8"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx + 5, cy, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 5, cy, 10, -0.8, 0.8); ctx.stroke();
  }
}

function pulseText(text, y) {
  ctx.globalAlpha = 0.6 + Math.sin(time * 4.5) * 0.4;
  ctx.fillStyle = "#ffd24a";
  ctx.font = "800 27px -apple-system, system-ui, sans-serif";
  ctx.fillText(text, VW / 2, y);
  ctx.globalAlpha = 1;
}

function panel(y, h) {
  ctx.fillStyle = "rgba(8,30,44,0.72)";
  roundRect(VW / 2 - 152, y, 304, h, 20);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2;
  roundRect(VW / 2 - 152, y, 304, h, 20);
  ctx.stroke();
}

function drawMedal(cx, cy, m) {
  // ribbon
  ctx.fillStyle = "#c8403e";
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy - 34); ctx.lineTo(cx - 2, cy - 12); ctx.lineTo(cx - 16, cy - 12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2d4d8f";
  ctx.beginPath();
  ctx.moveTo(cx + 10, cy - 34); ctx.lineTo(cx + 16, cy - 12); ctx.lineTo(cx + 2, cy - 12);
  ctx.closePath(); ctx.fill();
  // disc (gradient memoized per medal — cx/cy are fixed)
  if (!m.grad) {
    const g = ctx.createRadialGradient(cx - 7, cy - 7, 3, cx, cy, 24);
    g.addColorStop(0, m.c1); g.addColorStop(0.6, m.c2); g.addColorStop(1, m.c3);
    m.grad = g;
  }
  ctx.fillStyle = m.grad;
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = m.c3; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2); ctx.stroke();
  // star
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? 9 : 4;
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

function drawEntryArrow(cx, y, up, hot) {
  ctx.fillStyle = hot ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.08)";
  roundRect(cx - ENTRY.aw / 2, y, ENTRY.aw, ENTRY.ah, 10);
  ctx.fill();
  ctx.fillStyle = "#eaf4f8";
  ctx.beginPath();
  if (up) { ctx.moveTo(cx, y + 12); ctx.lineTo(cx + 11, y + 32); ctx.lineTo(cx - 11, y + 32); }
  else    { ctx.moveTo(cx, y + 34); ctx.lineTo(cx + 11, y + 14); ctx.lineTo(cx - 11, y + 14); }
  ctx.closePath(); ctx.fill();
}

function drawEntryPanel() {
  const py = ENTRY.py;
  panel(py, 420);
  ctx.fillStyle = "#fff";
  ctx.font = "800 30px -apple-system, system-ui, sans-serif";
  ctx.fillText("TOP 10 SPLASH!", VW / 2, py + 44);
  ctx.font = "600 16px -apple-system, system-ui, sans-serif";
  ctx.fillStyle = "#cfe8f2";
  ctx.fillText(entrySub, VW / 2, py + 76);   // cached in die() — no per-frame concat
  ctx.font = "800 42px -apple-system, system-ui, sans-serif"; // once, not ×3
  for (let i = 0; i < 3; i++) {
    const cx = ENTRY.cols[i], hot = i === entrySlot;
    drawEntryArrow(cx, ENTRY.upY, true, hot);
    ctx.fillStyle = hot ? "rgba(255,210,74,0.14)" : "rgba(255,255,255,0.06)";
    roundRect(cx - 28, ENTRY.boxY, 56, ENTRY.boxH, 10); ctx.fill();
    ctx.strokeStyle = hot ? "#ffd24a" : "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    roundRect(cx - 28, ENTRY.boxY, 56, ENTRY.boxH, 10); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.fillText(AZ[entryLetters[i]], cx, ENTRY.boxY + 46);
    drawEntryArrow(cx, ENTRY.dnY, false, hot);
  }
  const c = ENTRY.confirm;
  ctx.fillStyle = "rgba(255,210,74,0.92)";
  roundRect(c.x, c.y, c.w, c.h, 14); ctx.fill();
  ctx.fillStyle = "#1c2b35";
  ctx.font = "800 24px -apple-system, system-ui, sans-serif";
  ctx.fillText("CONFIRM", VW / 2, c.y + 35);
  ctx.fillStyle = "#9fc4d4";
  ctx.font = "600 17px -apple-system, system-ui, sans-serif";
  ctx.fillText("skip", VW / 2, ENTRY.skip.y + 28);
}

function drawHUD() {
  ctx.textAlign = "center";

  if (state !== S.MENU) {
    const sz = Math.round(54 * (1 + scorePop * 0.32));
    if (sz !== scoreFontSz) {        // sz only changes during the ~0.3 s pop
      scoreFontSz = sz;
      scoreFont = "800 " + sz + "px -apple-system, system-ui, sans-serif";
    }
    ctx.font = scoreFont;
    if (milestoneGlow > 0.01) {      // gold halo pulse on decade milestones
      ctx.globalAlpha = milestoneGlow;
      ctx.strokeStyle = "#ffd24a"; ctx.lineWidth = 10;
      ctx.strokeText(scoreStr, VW / 2, 92);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(255,255,255,0.92)"; ctx.lineWidth = 5;
    ctx.strokeText(scoreStr, VW / 2, 92);
    ctx.fillStyle = "rgba(16,40,52,0.9)";
    ctx.fillText(scoreStr, VW / 2, 92);
  }

  if (state === S.MENU) {
    panel(VH * 0.20, VH * 0.40);
    ctx.fillStyle = "#fff";
    ctx.font = "800 46px -apple-system, system-ui, sans-serif";
    ctx.fillText("GULL RUSH", VW / 2, VH * 0.20 + 64 + Math.sin(time * 2.2) * 3);
    ctx.font = "600 16px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "#cfe8f2";
    ctx.fillText("tap · space · ↑ to flap", VW / 2, VH * 0.20 + 102);
    ctx.fillStyle = "#ffd24a";
    ctx.fillText("thread the buoys · golden fish = +3", VW / 2, VH * 0.20 + 126);
    ctx.font = "700 15px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("goal: get to 100 & reach the pearl", VW / 2, VH * 0.20 + 160);
    ctx.fillStyle = "#ff9b6b";
    ctx.fillText("or are you gonna rage quit?", VW / 2, VH * 0.20 + 182);
    pulseText("TAP TO START", VH * 0.20 + 222);
    ctx.font = "600 16px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "#9fc4d4";
    ctx.fillText(bestLineMenu, VW / 2, VH * 0.20 + 256);
  }

  if (state === S.DEAD && deathT > 0.35) {
    const a = clamp((deathT - 0.35) / 0.3, 0, 1);
    ctx.globalAlpha = a;
    if (entryActive) {
      drawEntryPanel();
      ctx.globalAlpha = 1;
      drawMuteBtn();
      return;
    }
    const py = VH * 0.20;
    panel(py, VH * 0.46);
    ctx.fillStyle = "#fff";
    ctx.font = "800 38px -apple-system, system-ui, sans-serif";
    ctx.fillText("SPLASHDOWN!", VW / 2, py + 54);

    let medal = null;
    for (const m of MEDALS) if (score >= m.min) { medal = m; break; }
    if (medal) {
      drawMedal(VW / 2 - 92, py + 122, medal);
      ctx.font = "700 13px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = medal.c2;
      ctx.fillText(medal.name, VW / 2 - 92, py + 160);
    }
    const tx = medal ? VW / 2 + 36 : VW / 2;
    const isNewBest = score >= best && score > 0;
    // both 16px lines drawn in one font run — fewer ctx.font parses/frame
    ctx.font = "600 16px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "#cfe8f2";
    ctx.fillText("SCORE", tx, py + 102);
    ctx.fillStyle = isNewBest ? "#ffd24a" : "#9fc4d4";
    ctx.fillText(bestLineDead, tx, py + 166);  // cached in die()
    ctx.fillStyle = "#fff";
    ctx.font = "800 34px -apple-system, system-ui, sans-serif";
    ctx.fillText(scoreStr, tx, py + 136);

    // top-10 board — compact 5-row window, new entry kept visible/highlit
    let retryY = py + 232;
    if (board.length) {
      retryY = py + 312;             // clear of the 5th row's gold highlight
      const n = Math.min(5, board.length);
      const start = lastEntryIdx >= 0
        ? clamp(lastEntryIdx - 2, 0, Math.max(0, board.length - n)) : 0;
      ctx.font = "700 12px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = "#9fc4d4";
      // header stops claiming "top" when the window starts below rank 1
      ctx.fillText(start > 0 ? "· LEADERBOARD ·" : "· TOP SCORES ·", VW / 2, py + 188);
      ctx.font = "700 15px -apple-system, system-ui, sans-serif";
      for (let i = 0; i < n; i++) {
        const row = start + i, y = py + 208 + i * 17;
        if (row === lastEntryIdx) {
          ctx.fillStyle = "rgba(255,210,74,0.16)";
          roundRect(VW / 2 - 92, y - 13, 184, 17, 5);
          ctx.fill();
        }
        ctx.fillStyle = row === lastEntryIdx ? "#ffd24a" : "#cfe8f2";
        ctx.textAlign = "left";
        ctx.fillText(boardRows[row][0], VW / 2 - 78, y);   // cached strings —
        ctx.textAlign = "right";                           // rebuilt only when
        ctx.fillText(boardRows[row][1], VW / 2 + 78, y);   // the board changes
      }
      ctx.textAlign = "center";
    }

    if (deathT > T.retryDelay) pulseText("TAP TO RETRY", retryY);
    else if (deathT > 0.5) {         // delayed so the dim prompt doesn't imply taps work yet
      ctx.globalAlpha = a * 0.4;
      ctx.fillStyle = "#ffd24a";
      ctx.font = "800 27px -apple-system, system-ui, sans-serif";
      ctx.fillText("TAP TO RETRY", VW / 2, retryY);
    }
    ctx.globalAlpha = 1;
  }

  drawMuteBtn();
}

function drawPauseOverlay() {
  ctx.fillStyle = "rgba(4,18,28,0.62)";
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "800 38px -apple-system, system-ui, sans-serif";
  ctx.fillText("PAUSED", VW / 2, VH * 0.44);
  // fixed alpha (no pulse) — the pause frame is drawn once and frozen,
  // so a time-driven pulse would stick at a random brightness
  ctx.fillStyle = "#ffd24a";
  ctx.font = "800 27px -apple-system, system-ui, sans-serif";
  ctx.fillText("TAP TO RESUME", VW / 2, VH * 0.44 + 52);
}

/* ════════════════════════════ MAIN DRAW ═══════════════════════════════ */
function draw() {
  // fresh transform every frame — never accumulates; derived from the
  // ACTUAL backing-store size so rounding can't leave an unpainted hairline
  ctx.setTransform(canvas.width / VW, 0, 0, canvas.height / VH, 0, 0);

  if (shake > 0) ctx.translate(rnd(-shake, shake) * 0.45, rnd(-shake, shake) * 0.45);

  drawSky();
  drawCloudLayer(cloudsFar, P.cloudFar);
  drawIslands();
  drawWaterBack();
  drawBoats();
  drawCloudLayer(cloudsNear, P.cloudNear);
  drawObstacles();
  drawFishes();
  drawParticles();
  drawGull();
  drawRain();
  drawWind();
  drawWaterFront();
  drawFloaters();

  if (flashT > 0) {
    ctx.fillStyle = "rgba(255,255,255," + Math.min(1, flashT * 4) + ")";
    ctx.fillRect(-30, -30, VW + 60, VH + 60);
  }

  drawHUD();
  if (paused) drawPauseOverlay();
}

/* ═════════════════════════════ LOOP ═══════════════════════════════════ */
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) { lastT = now; return; }
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;   // clamp tab-switch spikes
  if (paused) {
    AudioSys.stormBed(0);            // silence the rain bed on the frozen frame
    // nothing animates while paused — draw the frozen frame once, then
    // skip redraws entirely (battery/thermals during auto-pause)
    if (!pausedDrawn) { draw(); pausedDrawn = true; }
    return;
  }
  pausedDrawn = false;
  time += dt;
  update(dt);
  draw();
}

reset();
refreshPalette();
requestAnimationFrame(frame);
})();
</script>
</body>
